<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Signing in · Groundwork</title>
  <script>
    // Capture in memory and scrub before loading any external resource.
    window.groundworkCallback = new URLSearchParams(location.search || location.hash.slice(1));
    history.replaceState(null, '', location.pathname);
  </script>
  <style>body{font:16px system-ui;background:#f5f7f2;color:#18332e;max-width:560px;margin:12vh auto;padding:24px}a{color:#17816b}</style>
</head>
<body>
  <h1 data-i18n>Signing in to Groundwork</h1>
  <p id="status" role="status" data-i18n>Opening your workspace…</p>
  <p><a href="/client-os/" data-i18n>Request a new sign-in link</a></p>
  <script src="/client-os/shell-i18n.js"></script>
  <script src="/client-os/config.js"></script>
  <script type="module">
    import {captureMagicLink, verifyMagicLink, SESSION_KEY} from '/client-os/auth.js';
    let query = window.groundworkCallback;
    delete window.groundworkCallback;
    try {
      const magic = captureMagicLink({search: '?' + query.toString(), pathname: location.pathname}, history);
      query = null;
      if (!magic) throw new Error('Invalid sign-in link. Request a new Groundwork link.');
      sessionStorage.removeItem(SESSION_KEY);
      // Check storage before consuming the single-use credential.
      sessionStorage.setItem('groundwork-storage-check', '1');
      sessionStorage.removeItem('groundwork-storage-check');
      const accessToken = await verifyMagicLink(magic, window.GROUNDWORK_CONFIG);
      sessionStorage.setItem(SESSION_KEY, accessToken);
      location.replace('/client-os/');
    } catch (error) {
      query = null;
      const say = window.groundworkShell ? window.groundworkShell.t : (s) => s;
      document.querySelector('#status').textContent = say(error.message || 'Sign-in failed. Request a new link.');
    }
  </script>
</body>
</html>
